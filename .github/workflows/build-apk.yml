name: Build HealthSync APK

# v2 — fixes the "Set up Android SDK" failure.
# Changes vs v1:
#   - android-actions/setup-android@v3 is gone: it fails on current
#     runners (it targets Node.js 20, which GitHub now forces onto
#     Node.js 24). The SDK is installed with the runner's own
#     sdkmanager instead — no Node-based action involved.
#   - actions/checkout@v5 and actions/setup-java@v5 (Node 24-native;
#     v4 is deprecated and will no longer receive updates).
# How to use it:
#   1. In your fork, open .github/workflows/build-apk.yml, replace its
#      whole content with this file, and commit.
#   2. Open the Actions tab, select "Build HealthSync APK",
#      click "Run workflow".
#   3. When it finishes, download the "HealthSync-debug-apk" artifact
#      (a ZIP containing app-debug.apk), copy the APK to your phone and
#      install it. Android will warn about an unrecognized app — expected
#      for a sideloaded APK; dismiss it.
# Notes:
#   - This builds the DEBUG variant: no signing key needed, works
#     immediately. For long-term daily use the README recommends the
#     release build; switching later needs a reinstall (your data lives
#     in Google Drive, so nothing is lost).
#   - Public repos (and public forks) get GitHub Actions free, so the
#     build costs nothing.
#   - The APK is kept as an Actions artifact (90 days by default).

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HealthSync-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
